name: Build macOS app

# The .dmg can only be produced on macOS, so this runs on a GitHub-hosted
# Mac. Push a v* tag to get a downloadable release; run it manually from the
# Actions tab to get a build artifact without cutting a release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Generate icons
        run: npm run icons

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build the .dmg
        # --publish never: electron-builder tries to upload to GitHub itself
        # when it sees a tag, which needs its own token. The release step
        # below owns publishing.
        run: npx electron-vite build && npx electron-builder --mac --publish never
        env:
          # Ad-hoc signed: no Developer ID certificate involved, so skip
          # notarization. First launch needs right-click -> Open.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: water-reminder-macos
          path: dist/*.dmg
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.dmg
          body: |
            Download the `.dmg` below on your Mac and drag the app to
            Applications.

            **First launch:** the build is ad-hoc signed rather than signed
            with a paid Apple Developer certificate, so Gatekeeper blocks a
            normal double-click. Right-click the app and choose **Open**,
            then confirm. Only needed once.

            If macOS instead claims the app **"is damaged"**, that is the
            download quarantine flag, not a corrupt file. Clear it:

            ```bash
            xattr -cr "/Applications/Water Reminder.app"
            ```

            The app lives in the menu bar — it has no Dock icon by design.
